<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>স্পেশাল অফার</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e3c72;
            text-align: center;
            padding: 50px;
        }
        .box {
            background: white;
            max-width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
        }
        .btn {
            background: #e17055;
            color: white;
            font-size: 20px;
            padding: 12px 25px;
            text-decoration: none;
            display: inline-block;
            border-radius: 50px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>🎁 আপনার পুরস্কার</h1>
        <p>নিচের বাটনে ক্লিক করুন</p>
        <a href="#" class="btn">👉 ক্লিক করুন 👈</a>
    </div>
</body>
</html>
